<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro como proveedor · Periferia</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1c1f24; --mut:#6b7280; --br:#e2e5ea; --ac:#1f5eff; --warn:#f59e0b; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --card:#1e2127; --tx:#e8eaee; --mut:#9aa3b2; --br:#2c313a; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--tx); height:100dvh; display:flex; flex-direction:column }
  header { padding:12px 16px; border-bottom:1px solid var(--br); background:var(--card); font-weight:600 }
  header small { color:var(--mut); font-weight:400; margin-left:8px }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto }
  .msg { padding:10px 14px; border-radius:12px; max-width:88%; white-space:pre-wrap; word-wrap:break-word }
  .user { align-self:flex-end; background:var(--ac); color:#fff }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--br) }
  .tool { align-self:flex-start; width:88%; border:1px solid var(--br); border-left:4px solid var(--ok); border-radius:8px; background:var(--card); padding:6px 10px; font-size:13px }
  .tool.fail { border-left-color:var(--err) } .tool summary { cursor:pointer; font-family:ui-monospace,monospace }
  .tool pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-all; color:var(--mut); font-size:12px }
  .confirm { border:2px solid var(--warn); background:color-mix(in srgb,var(--warn) 12%,var(--card)) }
  .confirm .tag { display:block; font-size:12px; font-weight:700; color:var(--warn); margin-bottom:4px }
  .acciones { display:flex; gap:8px; margin-top:8px } .acciones button { padding:6px 14px; border-radius:8px; border:1px solid var(--br); background:var(--card); color:var(--tx); cursor:pointer }
  .acciones button.si { background:var(--ok); color:#fff; border-color:var(--ok) }
  .pensando { color:var(--mut); font-style:italic }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--br); background:var(--card); max-width:820px; width:100%; margin:0 auto }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--br); background:var(--bg); color:var(--tx); font:inherit }
  form button { padding:10px 18px; border-radius:8px; border:0; background:var(--ac); color:#fff; font:inherit; cursor:pointer } button:disabled { opacity:.5 }
</style>
</head>
<body>
<header>Registro como proveedor <small>Periferia IT Group · el agente prepara, tú decides</small></header>
<div id="log"></div>
<form id="f"><input id="m" autocomplete="off" maxlength="2000" placeholder='Ej: Procesa el caso "co-industrias-delta". No envíes nada todavía.' autofocus><button id="b">Enviar</button></form>
<script>
const log = document.getElementById("log"), f = document.getElementById("f"), inp = document.getElementById("m"), btn = document.getElementById("b");
const sid = sessionStorage.getItem("sid") ||
  (crypto.randomUUID?.() ?? ("s" + Math.random().toString(36).slice(2) + Date.now().toString(36))); sessionStorage.setItem("sid", sid);
function el(cls, text) { const d = document.createElement("div"); d.className = cls; if (text !== undefined) d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
function tarjeta(t) {
  const d = el("tool" + (t.ok ? "" : " fail")), s = document.createElement("summary");
  s.textContent = (t.ok ? "✓ " : "✗ ") + t.nombre; const det = document.createElement("details"); det.appendChild(s);
  const a = document.createElement("pre"); a.textContent = "args: " + JSON.stringify(t.args); const r = document.createElement("pre"); r.textContent = "resultado: " + t.resultado;
  det.append(a, r); d.appendChild(det);
}
async function enviar(texto) {
  el("msg user", texto); btn.disabled = true; const p = el("pensando", "pensando…");
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessionId: sid, message: texto }) });
    const d = await res.json(); p.remove();
    if (!res.ok) { el("msg bot", d.error || "Error del servidor."); return; }
    (d.toolCalls || []).forEach(tarjeta);
    const b = el("msg bot" + (d.needsConfirmation ? " confirm" : ""));
    if (d.needsConfirmation) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "⚠ REQUIERE TU CONFIRMACIÓN"; b.appendChild(tag); }
    b.appendChild(document.createTextNode(d.reply));
    if (d.needsConfirmation) {
      const acc = document.createElement("div"); acc.className = "acciones";
      for (const [t, v, c] of [["Sí, confirmo", "Sí, confirmo", "si"], ["No, todavía no", "No, todavía no", ""]]) {
        const x = document.createElement("button"); x.textContent = t; x.className = c; x.onclick = () => { acc.remove(); enviar(v); }; acc.appendChild(x);
      }
      b.appendChild(acc);
    }
  } catch { p.remove(); el("msg bot", "No pude comunicarme con el servidor. Intenta de nuevo."); }
  finally { btn.disabled = false; inp.focus(); log.scrollTop = log.scrollHeight; }
}
f.addEventListener("submit", (e) => { e.preventDefault(); const t = inp.value.trim(); if (!t || btn.disabled) return; inp.value = ""; enviar(t); });
</script>
</body>
</html>
